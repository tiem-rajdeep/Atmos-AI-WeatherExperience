<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Atmos — A weather app that doesn't tell you the weather, it puts you inside it. Immersive animated weather environments with AI-style insights." />
  <title>Atmos — AI Weather Experience</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="state-clear">

  <!-- ═══════════════════════════════════════════════════════
       LAYER 1: Animated Particle Background
       ═══════════════════════════════════════════════════════ -->
  <div id="particle-layer" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 2: Weather Character
       ═══════════════════════════════════════════════════════ -->
  <div id="character-layer" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 3: Main App UI
       ═══════════════════════════════════════════════════════ -->
  <div id="app">

    <!-- ── Header ── -->
    <header class="atmos-header">
      <div class="atmos-logo">
        Atmos <span>/ Weather</span>
      </div>
      <div class="text-xs text-white/30 font-medium hidden sm:block">
        Live weather · AI insights
      </div>
    </header>

    <!-- ── Search Row ── -->
    <div class="search-row" role="search">
      <div class="search-input-wrap">
        <input
          id="search-input"
          type="text"
          placeholder="Search city…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search for a city"
        />
        <button
          id="search-btn"
          class="search-icon-btn"
          aria-label="Search"
          title="Search"
        >
          <!-- Search icon SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>

      <button
        id="location-btn"
        aria-label="Use my location"
        title="Use my location"
      >
        <!-- Location pin SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </button>

      <button
        id="unit-toggle"
        class="unit-toggle-btn"
        aria-label="Toggle Temperature Unit"
        title="Toggle °C / °F"
      >
        <span class="unit-c active">°C</span>
        <span class="unit-sep">/</span>
        <span class="unit-f">°F</span>
      </button>
    </div>

    <!-- ── Loading State (Skeleton) ── -->
    <div id="loading-state" class="w-full" aria-live="polite" aria-label="Loading weather data">
      <!-- Skeleton Main Card -->
      <div class="skeleton-card" style="height: 190px; padding: 20px;">
        <div class="skeleton-temp"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line mid"></div>
      </div>
      <!-- Skeleton Insight -->
      <div class="skeleton-card" style="height: 64px;">
        <div class="skeleton-line wide" style="margin-top: 24px;"></div>
      </div>
      <!-- Skeleton Stats -->
      <div class="grid grid-cols-2 gap-3">
        <div class="skeleton-card" style="height: 80px;"></div>
        <div class="skeleton-card" style="height: 80px;"></div>
        <div class="skeleton-card" style="height: 80px;"></div>
        <div class="skeleton-card" style="height: 80px;"></div>
      </div>
      <!-- Skeleton Hourly Forecast -->
      <div class="skeleton-card" style="height: 100px; padding: 14px;">
        <div class="skeleton-line short" style="margin-bottom: 12px;"></div>
        <div class="flex gap-2 overflow-hidden">
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
        </div>
      </div>
    </div>

    <!-- ── Error State ── -->
    <div id="error-state" class="glass-card w-full glow-grey hidden" role="alert">
      <div class="p-8 text-center">
        <span class="error-icon">🌫️</span>
        <p id="error-message" class="error-message">Something went wrong. Please try again.</p>
        <button id="retry-btn" aria-label="Try again">Try again</button>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         WEATHER CONTENT (hidden during load / error)
         ══════════════════════════════════════════════════════ -->
    <div id="weather-content" class="opacity-0 pointer-events-none w-full flex flex-col gap-3"
      aria-live="polite" aria-label="Current weather information">

      <!-- ── Main Glass Card ── -->
      <div class="glass-card glow-gold p-6 sm:p-8" id="main-card">
        <div class="main-card-inner">
          <div class="main-card-left">
            <!-- City -->
            <h1 id="city-name" class="weather-city mb-1">—</h1>
            <!-- Temperature -->
            <div id="temperature" class="weather-main-temp">—</div>
            <!-- Feels like -->
            <div id="feels-like" class="weather-feels mt-1">—</div>
            <!-- Condition text -->
            <div id="condition-desc" class="weather-condition mt-0.5">—</div>
          </div>

          <div class="main-card-right">
            <!-- Condition icon -->
            <div id="condition-icon" class="weather-condition-icon">—</div>
          </div>
        </div>
      </div>

      <!-- ── AI Insight Card ── -->
      <div class="glass-card glow-gold px-5 py-4" id="insight-card">
        <div class="insight-label-wrap">
          <span class="insight-sparkle">✨</span>
          <span class="insight-title">AI INSIGHT</span>
        </div>
        <p id="ai-insight" class="text-white/80 text-sm leading-relaxed" aria-live="polite">—</p>
      </div>

      <!-- ── Stat Cards Grid ── -->
      <div class="stat-grid" role="list" aria-label="Weather statistics">

        <div class="glass-card glow-gold" role="listitem">
          <div class="stat-card-inner">
            <span class="stat-icon" aria-hidden="true">
              <!-- Humidity / droplet -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
              </svg>
            </span>
            <div>
              <div class="stat-label">Humidity</div>
              <div id="stat-humidity" class="stat-value">—</div>
            </div>
          </div>
        </div>

        <div class="glass-card glow-gold" role="listitem">
          <div class="stat-card-inner">
            <span class="stat-icon" aria-hidden="true">
              <!-- Wind / arrow-right-left -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
                <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
                <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
              </svg>
            </span>
            <div>
              <div class="stat-label">Wind</div>
              <div id="stat-wind" class="stat-value">—</div>
            </div>
          </div>
        </div>

        <div class="glass-card glow-gold" role="listitem">
          <div class="stat-card-inner">
            <span class="stat-icon" aria-hidden="true">
              <!-- Visibility / eye -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
            <div>
              <div class="stat-label">Visibility</div>
              <div id="stat-visibility" class="stat-value">—</div>
            </div>
          </div>
        </div>

        <div class="glass-card glow-gold" role="listitem">
          <div class="stat-card-inner">
            <span class="stat-icon" aria-hidden="true">
              <!-- Pressure / gauge -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20"/>
                <path d="M12 6v6l4 2"/>
              </svg>
            </span>
            <div>
              <div class="stat-label">Pressure</div>
              <div id="stat-pressure" class="stat-value">—</div>
            </div>
          </div>
        </div>

      </div>

      <!-- ── Hourly Forecast Card ── -->
      <div class="glass-card glow-gold px-4 py-4" id="forecast-card">
        <div class="text-xs uppercase tracking-widest text-white/40 font-medium mb-3">
          Next 24 hours
        </div>
        <div id="hourly-strip" role="list" aria-label="Hourly forecast"></div>
      </div>

      <!-- ── Footer ── -->
      <div class="text-center text-white/20 text-xs mt-2 pb-2">
        Data from OpenWeatherMap · Built with ❤️ by Rajdeep
      </div>

    </div><!-- /weather-content -->
  </div><!-- /app -->

  <!-- ══════════════════════════════════════════════════════
       Scripts (order matters — dependencies first)
       ══════════════════════════════════════════════════════ -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/weatherState.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
